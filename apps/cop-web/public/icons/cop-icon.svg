<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Civil risk map app icon</title>
  <desc id="desc">Civil situation map icon with map grid, alert zone, weather point, and shared risk markers.</desc>
  <defs>
    <linearGradient id="bg" x1="72" x2="440" y1="32" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#15242c" />
      <stop offset="0.52" stop-color="#091219" />
      <stop offset="1" stop-color="#05090d" />
    </linearGradient>
    <radialGradient id="lime-glow" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#c8f08d" stop-opacity="0.22" />
      <stop offset="0.52" stop-color="#8cb6d8" stop-opacity="0.08" />
      <stop offset="1" stop-color="#05090d" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8cb6d8" stroke-opacity="0.16" stroke-width="1" />
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.42" />
    </filter>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#c8f08d" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect width="512" height="512" fill="#090d10" />
  <rect width="512" height="512" rx="88" fill="url(#bg)" />
  <rect width="512" height="512" rx="88" fill="url(#lime-glow)" />
  <rect x="35" y="35" width="442" height="442" rx="68" fill="url(#grid)" opacity="0.72" />
  <rect x="41" y="41" width="430" height="430" rx="62" fill="none" stroke="#c8f08d" stroke-opacity="0.72" stroke-width="5" />
  <rect x="60" y="60" width="392" height="392" rx="47" fill="none" stroke="#8cb6d8" stroke-opacity="0.24" stroke-width="2" />

  <g opacity="0.52">
    <path d="M92 255.5H420" stroke="#8cb6d8" stroke-width="2" />
    <path d="M255.5 92V420" stroke="#8cb6d8" stroke-width="2" />
    <path d="M128 372C174 310 222 286 281 278C334 271 378 245 412 191" fill="none" stroke="#c8f08d" stroke-opacity="0.36" stroke-width="3" />
    <path d="M110 176C166 214 218 225 265 214C312 203 354 211 398 247" fill="none" stroke="#8cb6d8" stroke-opacity="0.3" stroke-width="3" />
  </g>

  <g filter="url(#soft-shadow)">
    <circle cx="256" cy="256" r="132" fill="#0a1821" fill-opacity="0.92" stroke="#8cb6d8" stroke-opacity="0.58" stroke-width="4" />
    <circle cx="256" cy="256" r="96" fill="none" stroke="#c8f08d" stroke-opacity="0.46" stroke-width="4" stroke-dasharray="14 13" />
    <circle cx="256" cy="256" r="6" fill="#c8f08d" />

    <rect x="188" y="134" width="48" height="34" fill="#1d4ed8" stroke="#9cc7ff" stroke-width="5" />
    <path d="M361 179L386 204L361 229L336 204Z" fill="#ef4444" stroke="#ffb4b4" stroke-width="5" />
    <circle cx="148" cy="300" r="21" fill="#221d08" stroke="#facc15" stroke-width="5" />
    <path d="M318 355L341 379H295Z" fill="#122119" stroke="#6ee7a4" stroke-width="5" />

    <path d="M211 168L239 221" fill="none" stroke="#8cb6d8" stroke-opacity="0.55" stroke-width="3" />
    <path d="M354 211L302 239" fill="none" stroke="#8cb6d8" stroke-opacity="0.55" stroke-width="3" />
    <path d="M168 291L224 274" fill="none" stroke="#8cb6d8" stroke-opacity="0.5" stroke-width="3" />
  </g>

  <text x="256" y="313" text-anchor="middle" fill="#eaffc9" filter="url(#text-glow)" font-family="Inter, Arial, sans-serif" font-size="106" font-weight="900" letter-spacing="0">MAP</text>
  <path d="M122 404H390" stroke="#c8f08d" stroke-opacity="0.72" stroke-width="6" stroke-linecap="square" />
</svg>
