              minimum: 0
            neutral:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
    SafetyFeatureCollection:
      type: object
      required: [contractVersion, features, generatedAt, query, source, sources, summary, type, warnings]
      properties:
        contractVersion:
          type: string
          const: cop-safety-source-v1
        type:
          type: string
          const: FeatureCollection
        generatedAt:
          type: string
          format: date-time
        query:
          $ref: "#/components/schemas/SafetyFeatureQuery"
        source:
          $ref: "#/components/schemas/SafetyRootSource"
        sources:
          type: array
          items:
            $ref: "#/components/schemas/SafetySourceDescriptor"
        features:
          type: array
          items:
            $ref: "#/components/schemas/SafetyFeature"
        summary:
          $ref: "#/components/schemas/SafetySummary"
        sourceHealth:
          $ref: "#/components/schemas/SourceHealthOverride"
        warnings:
          type: array
          items:
            type: string
    SafetyFeatureQuery:
      type: object
      required: [bbox, layers, limit]
      properties:
        bbox:
          $ref: "#/components/schemas/SituationBbox"
        layers:
          type: array
          items:
            type: string
            enum: [boundary_admin, fire, flood, warnings, weather_alerts]
        limit:
          type: integer
          minimum: 1
          maximum: 1000
        sources:
          type: array
          items:
            type: string
            enum: [admin_boundaries, chmi_alerts, chmi_hydro, fire_hotspots, fire_incidents, mock, nasa_firms, weather_alerts]
    SafetyRootSource:
      type: object
      required: [sourceId, sourceType]
      properties:
        generatedAt:
          type: string
          format: date-time
        sourceId:
          type: string
          const: safety-data-api
        sourceType:
          type: string
          const: PUBLIC_SAFETY_AGGREGATE
    SafetySourceDescriptor:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
          enum: [admin_boundaries, chmi_alerts, chmi_hydro, fire_hotspots, fire_incidents, mock, nasa_firms, weather_alerts]
        label:
          type: string
        enabled:
          type: boolean
        mode:
          type: string
        priority:
          type: number
        baseUrl:
          type: string
          format: uri
        updateCadenceSeconds:
          type: integer
          minimum: 1
        layers:
          type: array
          items:
            type: string
            enum: [boundary_admin, fire, flood, warnings, weather_alerts]
        license:
          type: object
          additionalProperties: true
    SafetyFeature:
      type: object
      required: [geometry, properties, type]
      properties:
        type:
          type: string
          const: Feature
        id:
          oneOf:
            - type: string
            - type: number
        geometry:
          oneOf:
            - $ref: "#/components/schemas/GeoJsonPoint"
            - $ref: "#/components/schemas/GeoJsonPolygon"
            - $ref: "#/components/schemas/GeoJsonMultiPolygon"
        properties:
          $ref: "#/components/schemas/SafetyFeatureProperties"
    SafetyFeatureProperties:
      type: object
      required: [category, featureId, headline, layer, sourceId]
      properties:
        featureId:
          type: string
        layer:
          type: string
          enum: [boundary_admin, fire, flood, warnings, weather_alerts]
        headline:
          type: string
        category:
          type: string
        sourceId:
          type: string
        source:
          type: string
        sourceIncident:
          type: string
          description: Source-specific incident classification, for example CHMI_CAP_FIRE_DANGER or NASA_FIRMS_HOTSPOT.
        sourceName:
          type: string
        layerId:
          type: string
        providerId:
          type: string
        providerLayerId:
          type: string
        hazardType:
          type: string
        status:
          type: string
        styleHint:
          type: string
        iconHint:
          type: string
        areaName:
          type: string
        affectedArea:
          type: string
        adminLevel:
          oneOf:
            - type: number
            - type: string
        geometryMode:
          type: string
          enum: [admin_boundary, representative_point]
        basis:
          type: array
          items:
            type: string
        riverName:
          type: string
        stationId:
          type: string
        waterLevelCm:
          type: number
        discharge:
          type: number
          description: Current discharge in m3/s when available.
        floodStage:
          type: number
          description: Flood activity level, where 0 means no SPA and 1-3 are Czech SPA levels.
        trend:
          type: string
          enum: [falling, rising, stable, unknown]
        basin:
          type: string
        catchmentAreaKm2:
          type: number
        observedAt:
          type: string
          format: date-time
        effectiveAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        confidence:
          type: number
          minimum: 0
          maximum: 1
        stale:
          type: boolean
        severity:
          type: string
          enum: [advisory, critical, info, warning]
        urgency:
          type: string
        certainty:
          type: string
        affectedAreas:
          type: array
          items:
            type: string
        geocodes:
          type: array
          items:
            type: object
            required: [scheme, value]
            properties:
              scheme:
                type: string
              value:
                type: string
        description:
          type: string
        recommendedAction:
          type: string
        license:
          type: object
          additionalProperties: true
        metrics:
          type: object
          additionalProperties: true
        tags:
          type: object
          additionalProperties: true
    SafetySummary:
      type: object
      required: [advisoryCount, criticalCount, featureCount, sourceCount, staleFeatureCount, warningCount]
      properties:
        advisoryCount:
          type: integer
          minimum: 0
        criticalCount:
          type: integer
          minimum: 0
        featureCount:
          type: integer
          minimum: 0
        sourceCount:
          type: integer
          minimum: 0
        staleFeatureCount:
          type: integer
          minimum: 0
        warningCount:
          type: integer
          minimum: 0
    SourceHealthOverride:
      type: object
      required: [evaluatedAt, health]
      properties:
        health:
          type: string
          enum: [DEGRADED, ONLINE, STALE, UNAVAILABLE, WAITING]
        evaluatedAt:
          type: string
          format: date-time
        generatedAt:
          type: string
          format: date-time
        lastPollAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: string
          format: date-time
        detail:
          type: string
        lastError:
          type: string
        summary:
          type: object
          additionalProperties: true
        warnings:
          type: array
          items:
            type: string
    SourceLifecycleResult:
      type: object
      required: [sourceSystemId, status, changedAt]
      properties:
        sourceSystemId:
          type: string
        status:
          type: string
          enum: [REGISTERED, ACTIVE, SUSPENDED, REVOKED]
        changedAt:
          type: string
          format: date-time
    AuditEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [auditId, eventType, timestamp]
            properties:
              auditId:
                type: string
                format: uuid
              eventType:
                type: string
              timestamp:
                type: string
                format: date-time
              actor:
                type: string
              correlationId:
                type: string
    AiCopResponse:
      type: object
      required: [requestId, status, policy, result, auditId]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [COMPLETED, REJECTED, NEEDS_HUMAN_REVIEW]
        provider:
          type: string
          enum: [openai, codex, local, mock]
        model:
          type: string
        policy:
          type: object
          required: [allowed, reason, redactionsApplied]
          properties:
            allowed:
              type: boolean
            reason:
              type: string
            redactionsApplied:
              type: boolean
        result:
          type: object
          additionalProperties: true
        auditId:
          type: string
          format: uuid
    HealthStatus:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        timestamp:
          type: string
          format: date-time
    MessagingStatus:
      type: object
      required: [chatAvailable, checkedAt, contractVersion, enabled, providerId, serviceName, status, warnings]
      properties:
        architecture:
          type: object
          additionalProperties: true
        chatAvailable:
          type: boolean
          description: >
            True only after a client-safe Matrix/E2EE bootstrap contract is
            advertised by provider metadata and provider health is operational.
        checkedAt:
          type: string
          format: date-time
        contractVersion:
          type: string
          enum: [cop-messaging-status-v1]
        detail:
          type: string
        enabled:
          type: boolean
        features:
          type: object
          additionalProperties: true
        providerId:
          type: string
          enum: [csm.messaging]
        publicUrl:
          type: string
          format: uri
        security:
          type: object
          additionalProperties: true
        serviceName:
          type: string
        status:
          type: string
          enum: [online, degraded, disabled]
        warnings:
          type: array
          items:
            type: string
    MessagingBootstrap:
      type: object
      required: [chatAvailable, contractVersion, enabled, providerId, status, tokenAvailable, warnings]
      properties:
        accessToken:
          type: string
          description: Short-lived Matrix user token scoped to the authenticated user.
        chatAvailable:
          type: boolean
        contractVersion:
          type: string
          enum: [cop-messaging-bootstrap-v1]
        detail:
          type: string
        deviceId:
          type: string
        e2eeRequired:
          type: boolean
        enabled:
          type: boolean
        expiresAt:
          type: string
          format: date-time
        homeserverBaseUrl:
          type: string
          format: uri
        providerId:
          type: string
          enum: [csm.messaging]
        serverName:
          type: string
        status:
          type: string
          enum: [online, degraded, disabled]
        tokenAvailable:
          type: boolean
        userId:
          type: string
        warnings:
          type: array
          items:
            type: string
    MessagingBootstrapRequest:
      type: object
      additionalProperties: false
      properties:
        deviceId:
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9._=-]{1,64}$"
          description: Stable per-browser Matrix device identifier generated by the client and sent in the request body and as x-csm-device-id to Messaging.
    MessagingConversationList:
      type: object
      required: [contractVersion, conversations, count, enabled, providerId, status, warnings]
      properties:
        contractVersion:
          type: string
          enum: [cop-messaging-conversations-v1]
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/MessagingConversation"
        count:
          type: integer
          minimum: 0
        enabled:
          type: boolean
        providerId:
          type: string
          enum: [csm.messaging]
        status:
          type: string
          enum: [online, degraded, disabled]
        warnings:
          type: array
          items:
            type: string
    MessagingConversationCreateRequest:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        type:
          type: string
          enum: [direct, group]
          default: group
        members:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MessagingConversationMember"
        mapLinks:
          type: array
          maxItems: 25
          items:
            $ref: "#/components/schemas/MessagingMapLink"
        metadata:
          type: object
          additionalProperties: true
          description: Safe metadata only. Plaintext message fields are rejected by COP and CSM Messaging.
    MessagingConversationCreateResponse:
      type: object
      required: [contractVersion, enabled, providerId, status, warnings]
      properties:
        contractVersion:
          type: string
          enum: [cop-messaging-conversations-v1]
        conversation:
          $ref: "#/components/schemas/MessagingConversation"
        enabled:
          type: boolean
        providerId:
          type: string
          enum: [csm.messaging]
        status:
          type: string
          enum: [online, degraded, disabled]
        warnings:
          type: array
          items:
            type: string
    MessagingConversationMembersRequest:
      type: object
      required: [members]
      additionalProperties: false
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/MessagingConversationMember"
    MessagingConversationMemberSyncResponse:
      type: object
      required: [contractVersion, enabled, providerId, status, warnings]
      properties:
        contractVersion:
          type: string
          enum: [cop-messaging-conversations-v1]
        conversation:
          $ref: "#/components/schemas/MessagingConversation"
        enabled:
          type: boolean
        providerId:
          type: string
          enum: [csm.messaging]
        status:
          type: string
          enum: [online, degraded, disabled]
        warnings:
          type: array
          items:
            type: string
    MessagingConversation:
      type: object
      required: [conversationId, title, type]
      properties:
        conversationId:
          type: string
        title:
          type: string
        type:
          type: string
          enum: [direct, group]
        status:
          type: string
        encrypted:
          type: boolean
        e2eeRequired:
          type: boolean
        memberCount:
          type: integer
          minimum: 0
        mapLinkCount:
          type: integer
          minimum: 0
        matrix:
          type: object
          properties:
            roomId:
              type:
                - string
                - "null"
            state:
              type: string
            homeserverBaseUrl:
              type: string
              format: uri
            serverName:
              type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/MessagingConversationMember"
        metadata:
          type: object
          additionalProperties: true
          description: Safe scalar integration metadata, for example source and externalId.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        disclaimer:
          type: string
    MessagingConversationMember:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
        displayName:
          type: string
        role:
          type: string
    MessagingMapLink:
      type: object
      required: [targetId]
      properties:
        targetId:
          type: string
        layerId:
          type: string
        label:
          type: string
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: number
    MessagingMatrixIdentityResolveRequest:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            maxLength: 160
    MessagingMatrixIdentityResolution:
      type: object
      required: [contractVersion, enabled, identities, providerId, status, warnings]
      properties:
        contractVersion:
          type: string
          enum: [cop-messaging-identities-v1]
        enabled:
          type: boolean
        identities:
          type: array
          items:
            $ref: "#/components/schemas/MessagingMatrixIdentity"
        providerId:
          type: string
          enum: [csm.messaging]
        status:
          type: string
          enum: [online, degraded, disabled]
        warnings:
          type: array
          items:
            type: string
    MessagingMatrixIdentity:
      type: object
      required: [userId, matrixUserId]
      properties:
        userId:
          type: string
        matrixUserId:
          type: string
        displayName:
          type: string
    MessagingMatrixRoomBindingRequest:
      type: object
      required: [roomId]
      additionalProperties: false
      properties:
        roomId:
          type: string
          maxLength: 512
          pattern: "^![^\\s:]+:.+$"
        encrypted:
          type: boolean
    MessagingMatrixRoomBindingResponse:
      type: object
      required: [contractVersion, enabled, providerId, status, warnings]
      properties:
        contractVersion:
          type: string
          enum: [cop-messaging-room-binding-v1]
        conversation:
          $ref: "#/components/schemas/MessagingConversation"
        enabled:
          type: boolean
        providerId:
          type: string
          enum: [csm.messaging]
        status:
          type: string
          enum: [online, degraded, disabled]
        warnings:
          type: array
          items:
            type: string
    DependencyHealth:
      type: object
      required: [status, dependencies]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable, disabled]
        dependencies:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name:
                type: string
              status:
                type: string
                enum: [ok, degraded, unavailable, disabled]
              detail:
                type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, correlationId]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  issue:
                    type: string
            correlationId:
              type: string
