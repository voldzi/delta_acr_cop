openapi: 3.1.0
info:
  title: ACR COP Data Fabric Main COP API
  version: 0.1.0
  summary: Documentation-first OpenAPI skeleton for the main COP system.
  license:
    name: Internal baseline - license pending
    identifier: LicenseRef-Internal-Baseline
  description: >
    API baseline for ingest, COP query, subscriptions, source registry,
    symbology, audit, AI assistance, health and metrics. The API supports
    situational awareness and data interoperability only; it does not define
    targeting, weapon control or use-of-force workflows.
servers:
  - url: /
    description: Relative server URL for local, test and deployed environments.
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: Authenticated operator profile and user-scoped preferences.
  - name: Ingest
    description: Event and batch ingest endpoints for registered external sources.
  - name: COP
    description: Query and subscription endpoints for policy-filtered COP state.
  - name: Streaming
    description: Snapshot and delta stream endpoints.
  - name: Symbology
    description: NATO symbol resolution endpoints owned by the main COP system.
  - name: Sources
    description: Source Registry lifecycle endpoints.
  - name: Audit
    description: Audit and provenance query endpoints.
  - name: AI
    description: Guardrailed AI assistance endpoints.
  - name: Health
    description: Liveness, readiness and dependency health endpoints.
  - name: Metrics
    description: Operational metrics endpoints.
paths:
  /api/v1/me/preferences:
    get:
      tags: [Identity]
      summary: Read authenticated operator preferences.
      operationId: getMyCopPreferences
      description: >
        Returns the Keycloak/lab actor identity plus server-side COP workspace,
        map, replay and alert preferences for the authenticated operator.
      responses:
        "200":
          description: Operator preference profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferenceProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Identity]
      summary: Upsert authenticated operator preferences.
      operationId: putMyCopPreferences
      description: >
        Persists only display, workspace, replay and informational alert
        preferences. This endpoint does not create tasking, targeting or
        weapon workflow state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferenceUpdate"
      responses:
        "200":
          description: Updated operator preference profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferenceProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/ingest/events:
    post:
      tags: [Ingest]
      summary: Accept one canonical event envelope.
      operationId: ingestEvent
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/ContractVersionHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/canonical-event-envelope.schema.json"
      responses:
        "202":
          description: Event accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/ingest/batches:
    post:
      tags: [Ingest]
      summary: Accept a batch of canonical event envelopes.
      operationId: ingestBatch
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/ContractVersionHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatchRequest"
      responses:
        "202":
          description: Batch accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestBatchAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/cop/tracks:
    get:
      tags: [COP]
      summary: Query policy-filtered COP tracks.
      operationId: listCopTracks
      parameters:
        - name: bbox
          in: query
          required: false
          schema:
            type: string
          description: minLon,minLat,maxLon,maxLat
        - name: layers
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: objectTypes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: minConfidence
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 1
        - name: updatedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: includeSynthetic
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include tracks older than the configured active display lifecycle.
      responses:
        "200":
          description: COP tracks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopTrackList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cop/conflicts:
    get:
      tags: [COP]
      summary: Query server-side COP conflict evidence.
      operationId: listCopConflictEvidence
      description: >
        Returns derived data-quality conflict evidence for current COP objects.
        Evidence may include affiliation variance, lifecycle variance, source
        position variance, low confidence, degraded source health and object
        states already marked as conflicted. This endpoint is informational only
        and does not provide targeting or action recommendations.
      parameters:
        - name: objectIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated object IDs. When omitted, current objects are evaluated.
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 300
          description: Evaluate recent history newer than this many seconds from server time.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 24
          description: Maximum retained points per object used for evidence.
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include tracks older than the configured active display lifecycle.
      responses:
        "200":
          description: Server-side conflict evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopConflictEvidenceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cop/alerts:
    get:
      tags: [COP]
      summary: Query policy-filtered COP alerts.
      operationId: listCopAlerts
      description: >
        Returns derived informational alerts from current COP tracks, server-side
        conflict evidence and source health. Alerts support operator
        acknowledgement, but do not provide tasking, targeting or weapon workflow.
      parameters:
        - name: includeAcknowledged
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include alerts already acknowledged by an operator.
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include alerts derived from tracks outside the active lifecycle window.
      responses:
        "200":
          description: Active COP alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopAlertList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cop/alerts/{alertId}/acknowledge:
    post:
      tags: [COP]
      summary: Acknowledge an informational COP alert.
      operationId: acknowledgeCopAlert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Alert acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/cop/track-history:
    get:
      tags: [COP]
      summary: Query policy-filtered temporal history for COP tracks.
      operationId: listCopTrackHistory
      description: >
        Returns retained server-side temporal history points for one or more
        tracks. The result is intended for timeline/replay and route-history
        visualization; it is not an action or targeting workflow.
      parameters:
        - name: objectIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated object IDs. When omitted, all retained track histories are returned.
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Keep only points newer than this many seconds from server time.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 120
          description: Maximum retained points per object returned by this request.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Temporal COP track history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopTrackHistoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cop/subscriptions:
    post:
      tags: [COP]
      summary: Create a COP subscription for snapshot and delta distribution.
      operationId: createCopSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cop-subscription.schema.json"
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopSubscriptionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/stream/cop/{subscriptionId}:
    get:
      tags: [Streaming]
      summary: Read legacy COP snapshot for a subscription.
      operationId: streamCopSubscription
      description: >
        Compatibility endpoint returning the current subscription snapshot.
        The live browser stream is exposed at /api/v1/stream/cop/live.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stream established.
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/StreamMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/stream/cop/live:
    get:
      tags: [Streaming]
      summary: Open live COP Server-Sent Events stream.
      operationId: streamLiveCop
      description: >
        SSE stream that emits a policy-filtered snapshot, object delta messages
        from accepted ingest events, and heartbeat messages. Clients authenticate
        with the standard Authorization bearer header.
      responses:
        "200":
          description: Stream established.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/stream/cop/health:
    get:
      tags: [Streaming]
      summary: Read COP stream health and backpressure metrics.
      operationId: getCopStreamHealth
      description: Operational health for the live COP stream. This endpoint reports distribution metrics only; it does not expose targeting or action workflow.
      responses:
        "200":
          description: Stream health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/symbology/resolve:
    post:
      tags: [Symbology]
      summary: Resolve a canonical object into NATO symbol metadata.
      operationId: resolveSymbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/symbol-resolve-request.schema.json"
      responses:
        "200":
          description: Symbol resolution.
          content:
            application/json:
              schema:
                $ref: "./schemas/symbol-resolve-response.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sources:
    get:
      tags: [Sources]
      summary: List registered source systems.
      operationId: listSources
      responses:
        "200":
          description: Source systems.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "./schemas/source-system.schema.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Sources]
      summary: Register a source system.
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/source-system.schema.json"
      responses:
        "201":
          description: Source system registered.
          content:
            application/json:
              schema:
                $ref: "./schemas/source-system.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sources/health:
    get:
      tags: [Sources]
      summary: List source health summaries.
      operationId: listSourceHealth
      responses:
        "200":
          description: Source health summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceHealthList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sources/{sourceSystemId}:
    get:
      tags: [Sources]
      summary: Get one source system.
      operationId: getSource
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdPath"
      responses:
        "200":
          description: Source system.
          content:
            application/json:
              schema:
                $ref: "./schemas/source-system.schema.json"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sources]
      summary: Update source system metadata and permissions.
      operationId: updateSource
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Source system updated.
          content:
            application/json:
              schema:
                $ref: "./schemas/source-system.schema.json"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sources/{sourceSystemId}/revoke:
    post:
      tags: [Sources]
      summary: Revoke a source system.
      operationId: revokeSource
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdPath"
      responses:
        "202":
          description: Source revocation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceLifecycleResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/audit/events:
    get:
      tags: [Audit]
      summary: Query audit events.
      operationId: listAuditEvents
      parameters:
        - name: correlationId
          in: query
          required: false
          schema:
            type: string
        - name: sourceSystemId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/ai/cop-assistant/query:
    post:
      tags: [AI]
      summary: Ask the AI COP assistant for allowed data assistance.
      operationId: queryCopAssistant
      description: AI assistance is limited to explanation, summarization, query help, data quality and documentation support.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/ai-cop-query.schema.json"
      responses:
        "200":
          description: AI assistant response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCopResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe.
      operationId: healthLive
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe.
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /health/dependencies:
    get:
      tags: [Health]
      summary: Dependency health.
      operationId: healthDependencies
      security: []
      responses:
        "200":
          description: Dependency health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyHealth"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics endpoint.
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    mtlsAuth:
      type: mutualTLS
  parameters:
    SourceSystemIdHeader:
      name: X-Source-System-Id
      in: header
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ContractVersionHeader:
      name: X-Contract-Version
      in: header
      required: true
      schema:
        type: string
        example: cop-ingest-v1
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    SourceSystemIdPath:
      name: sourceSystemId
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request or schema validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Policy denied the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict, typically idempotency mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Business validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AuthenticatedActor:
      type: object
      required: [authMode, displayName, subjectId, username]
      properties:
        authMode:
          type: string
          enum: [lab, oidc]
        displayName:
          type: string
        email:
          type: string
          format: email
        subjectId:
          type: string
          description: Stable lab identity or OIDC subject claim.
        username:
          type: string
    UserPreferenceUpdate:
      type: object
      properties:
        alertPreferences:
          $ref: "#/components/schemas/UserAlertPreferences"
        preferences:
          $ref: "#/components/schemas/UserDisplayPreferences"
    UserPreferenceProfile:
      type: object
      required: [actor, alertPreferences, preferences, updatedAt]
      properties:
        actor:
          $ref: "#/components/schemas/AuthenticatedActor"
        alertPreferences:
          $ref: "#/components/schemas/UserAlertPreferences"
        preferences:
          $ref: "#/components/schemas/UserDisplayPreferences"
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    UserAlertPreferences:
      type: object
      properties:
        enabledTypes:
          type: array
          items:
            type: string
            enum: [LOW_CONFIDENCE, SOURCE_DEGRADED, TRACK_CONFLICT, TRACK_LOST, TRACK_STALE]
        minimumSeverity:
          type: string
          enum: [info, warning, critical]
      additionalProperties: false
    UserDisplayPreferences:
      type: object
      properties:
        activeWorkspace:
          type: string
          enum: [map, data, sources, alerts, replay]
        affiliationScope:
          type: string
          enum: [all, friend, hostile, neutral, unknown]
        alertRadiusKm:
          type: number
          minimum: 1
          maximum: 50
        autoFit:
          type: boolean
        autoRefresh:
          type: boolean
        domainScope:
          type: string
          enum: [all, AIR, LAND, SEA, RESCUE, OTHER]
        includeSynthetic:
          type: boolean
        mapView:
          $ref: "#/components/schemas/MapViewPreference"
        minConfidence:
          type: number
          minimum: 0
          maximum: 1
        predictionMinutes:
          type: number
          minimum: 2
          maximum: 20
        predictionMode:
          type: string
          enum: [adaptive, telemetry, history, maneuver]
        proximityAlertEnabled:
          type: boolean
        refreshSeconds:
          type: number
          minimum: 1
          maximum: 60
        selectedLayer:
          type: string
          enum: [air-situation, uav, friendly, foreign, data-quality]
        showHistory:
          type: boolean
        showPrediction:
          type: boolean
        trackHistoryLimit:
          type: number
          minimum: 1
          maximum: 1000
        trackHistoryWindowSeconds:
          type: number
          minimum: 1
          maximum: 3600
      additionalProperties: false
