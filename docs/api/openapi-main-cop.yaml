openapi: 3.1.0
info:
  title: Civil Situation Map API
  version: 0.1.0
  summary: Documentation-first OpenAPI skeleton for the civil situation map.
  license:
    name: Internal baseline - license pending
    identifier: LicenseRef-Internal-Baseline
  description: >
    API baseline for ingest, situation queries, subscriptions, source registry,
    symbology, audit, AI assistance, health and metrics. The API supports
    situational awareness and data interoperability only; it does not define
    targeting, weapon control or use-of-force workflows.
servers:
  - url: /
    description: Relative server URL for local, test and deployed environments.
security:
  - bearerAuth: []
tags:
  - name: Identity
    description: Authenticated operator profile and user-scoped preferences.
  - name: Mobile
    description: Native iPhone/iPad bootstrap, offline snapshot and device registration endpoints.
  - name: Map Catalog
    description: Source-neutral map layer catalog used by web and native clients.
  - name: Community Reports
    description: User-created civil reports with location and media upload slots.
  - name: Ingest
    description: Event and batch ingest endpoints for registered external sources.
  - name: Situation State
    description: Query and subscription endpoints for policy-filtered situation state.
  - name: Streaming
    description: Snapshot and delta stream endpoints.
  - name: Symbology
    description: Symbol resolution endpoints owned by the situation map system.
  - name: Sources
    description: Source Registry lifecycle endpoints.
  - name: Situation Context
    description: Context-only public situation layers proxied from SIM situation-data-api.
  - name: Safety Data
    description: Context-only public safety layers proxied from SIM safety-data-api.
  - name: TAK Gateway
    description: Authenticated server-side partner TAK/CoT context proxied from SIM tak-gateway-api.
  - name: Audit
    description: Audit and provenance query endpoints.
  - name: Messaging
    description: Server-side status bridge for the standalone CSM Messaging provider.
  - name: AI
    description: Guardrailed AI assistance endpoints.
  - name: Health
    description: Liveness, readiness and dependency health endpoints.
  - name: Metrics
    description: Operational metrics endpoints.
paths:
  /api/v1/me/preferences:
    get:
      tags: [Identity]
      summary: Read authenticated operator preferences.
      operationId: getMyCopPreferences
      description: >
        Returns the Keycloak/lab actor identity plus server-side COP workspace,
        map, replay and alert preferences for the authenticated operator.
      responses:
        "200":
          description: Operator preference profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferenceProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Identity]
      summary: Upsert authenticated operator preferences.
      operationId: putMyCopPreferences
      description: >
        Persists only display, workspace, replay and informational alert
        preferences. This endpoint does not create tasking, targeting or
        weapon workflow state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferenceUpdate"
      responses:
        "200":
          description: Updated operator preference profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferenceProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/mobile/bootstrap:
    get:
      tags: [Mobile]
      summary: Read native mobile bootstrap payload.
      operationId: getMobileBootstrap
      description: >
        Single startup endpoint for iPhone/iPad clients. It returns safe public
        mobile configuration, user profile, map settings, endpoint discovery,
        capabilities and the current policy-filtered read-only COP snapshot.
      parameters:
        - $ref: "#/components/parameters/HistorySecondsQuery"
        - $ref: "#/components/parameters/HistoryLimitQuery"
        - $ref: "#/components/parameters/ObjectIdsQuery"
        - $ref: "#/components/parameters/IncludeExpiredQuery"
        - name: includeAcknowledged
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include acknowledged informational alerts in the snapshot.
      responses:
        "200":
          description: Native mobile bootstrap payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileBootstrap"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/mobile/offline-snapshot:
    get:
      tags: [Mobile]
      summary: Read native mobile offline snapshot.
      operationId: getMobileOfflineSnapshot
      description: >
        Returns the same policy-filtered read-only COP data used by bootstrap,
        without profile/config metadata. Native clients store this in encrypted
        device storage and must mark it stale according to cachePolicy.
      parameters:
        - $ref: "#/components/parameters/HistorySecondsQuery"
        - $ref: "#/components/parameters/HistoryLimitQuery"
        - $ref: "#/components/parameters/ObjectIdsQuery"
        - $ref: "#/components/parameters/IncludeExpiredQuery"
        - name: includeAcknowledged
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Native mobile offline snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileOfflineSnapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/map/catalog:
    get:
      tags: [Map Catalog]
      summary: Read source-neutral map catalog.
      operationId: getMapCatalog
      description: >
        Returns the authoritative COP map catalog. The catalog groups user-facing
        layers independently from provider internals, separates technical inputs
        from citizen-visible layers, and preserves provider/source provenance for
        diagnostics and future providers.
      parameters:
        - name: includeDiagnostics
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include diagnostic layers and source inputs. Ignored for unauthenticated public-read requests.
        - name: includePartner
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include partner/private layers such as TAK Gateway. Ignored for unauthenticated public-read requests.
        - name: locale
          in: query
          required: false
          schema:
            type: string
            default: cs-CZ
          description: Preferred label locale.
      responses:
        "200":
          description: Source-neutral map catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapCatalog"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/geocode/search:
    get:
      tags: [Map Catalog]
      summary: Search public places for map navigation.
      operationId: searchPlaces
      description: >
        Returns client-safe geocoding results for map navigation. COP calls the
        configured geocoder server-side and caches repeated searches so web and
        native clients do not need direct external geocoder access.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
            maxLength: 160
          description: Place query, for example "Kyjev" or "Praha".
        - name: language
          in: query
          required: false
          schema:
            type: string
            default: cs,en
          description: Preferred result language passed to the provider.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 8
            default: 5
      responses:
        "200":
          description: Place search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaceGeocodeSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/map/query:
    post:
      tags: [Map Catalog]
      summary: Query source-neutral map features.
      operationId: queryMapFeatures
      description: >
        Single public COP feature query endpoint. Clients select catalog layer
        IDs from /api/v1/map/catalog; COP translates those layer IDs to internal
        provider queries server-side. Provider-specific SIM endpoints are not
        part of the COP public API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapFeatureQueryRequest"
      responses:
        "200":
          description: Aggregated source-neutral map feature result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapFeatureQueryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/mobile/devices:
    post:
      tags: [Mobile]
      summary: Register or refresh a native mobile device session.
      operationId: registerMobileDevice
      description: >
        Pilot endpoint for future APNS, MDM and device/session policy. The
        server records a device session and audit event. It does not currently
        send push notifications and does not store the raw APNS token in the
        response.
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileDeviceRegistrationRequest"
      responses:
        "202":
          description: Mobile device session accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileDeviceRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/community/reports:
    get:
      tags: [Community Reports]
      summary: List community reports for a map viewport.
      operationId: listCommunityReports
      parameters:
        - name: bbox
          in: query
          required: false
          schema:
            type: string
            pattern: "^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$"
          description: "west,south,east,north"
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated community report categories.
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated statuses. Defaults to submitted,published plus own drafts when requested.
        - name: includeOwnDrafts
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: Community reports and map FeatureCollection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Community Reports]
      summary: Create a draft community report.
      operationId: createCommunityReport
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportCreateRequest"
      responses:
        "201":
          description: Draft report created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/community/reports/{reportId}:
    get:
      tags: [Community Reports]
      summary: Read one community report.
      operationId: getCommunityReport
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
      responses:
        "200":
          description: Community report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Community Reports]
      summary: Update an owned community report.
      operationId: updateCommunityReport
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityReportUpdateRequest"
      responses:
        "200":
          description: Updated community report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Community Reports]
      summary: Delete an owned community report and its media metadata.
      operationId: deleteCommunityReport
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "204":
          description: Community report deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/community/reports/{reportId}/submit:
    post:
      tags: [Community Reports]
      summary: Submit an owned draft report for sharing/moderation.
      operationId: submitCommunityReport
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Submitted report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/community/reports/{reportId}/attachments:
    post:
      tags: [Community Reports]
      summary: Create a media upload slot for an owned report.
      operationId: createCommunityReportAttachmentUpload
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityAttachmentUploadRequest"
      responses:
        "201":
          description: Attachment metadata and presigned upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityAttachmentUploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/community/reports/{reportId}/attachments/{attachmentId}/complete:
    post:
      tags: [Community Reports]
      summary: Mark an uploaded community report attachment as complete.
      operationId: completeCommunityReportAttachmentUpload
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                byteSize:
                  type: integer
                  minimum: 1
                checksumSha256:
                  type: string
                  pattern: "^[0-9a-fA-F]{64}$"
      responses:
        "200":
          description: Completed attachment metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportAttachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/community/reports/{reportId}/attachments/{attachmentId}/upload:
    post:
      tags: [Community Reports]
      summary: Upload an attachment through COP API as a fallback to direct object-storage PUT.
      operationId: proxyUploadCommunityReportAttachment
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
          video/mp4:
            schema:
              type: string
              format: binary
          video/quicktime:
            schema:
              type: string
              format: binary
          application/pdf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityAttachmentProxyUploadRequest"
      responses:
        "200":
          description: Uploaded attachment metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityReportAttachment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/community/reports/{reportId}/attachments/{attachmentId}/content:
    get:
      tags: [Community Reports]
      summary: Stream uploaded community media for map/details playback.
      operationId: getCommunityReportAttachmentContent
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Attachment content.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/quicktime:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        "206":
          description: Partial attachment content for video range playback.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/community/reports/{reportId}/attachments/{attachmentId}/derivatives/{derivativeId}/content:
    get:
      tags: [Community Reports]
      summary: Stream an authorized derived media object, such as XR side-by-side video.
      operationId: getCommunityReportAttachmentDerivativeContent
      parameters:
        - $ref: "#/components/parameters/CommunityReportIdPath"
        - name: attachmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: derivativeId
          in: path
          required: true
          schema:
            type: string
            enum: [xr-sbs]
      responses:
        "200":
          description: Derived media content.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "206":
          description: Partial derived content for video range playback.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/community/groups:
    get:
      tags: [Community Reports]
      summary: List community sharing groups visible to the authenticated user.
      operationId: listCommunityGroups
      responses:
        "200":
          description: Community sharing groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityGroupListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Community Reports]
      summary: Create a community sharing group for restricted media access.
      operationId: createCommunityGroup
      parameters:
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityGroupCreateRequest"
      responses:
        "201":
          description: Community group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/community/groups/{groupId}:
    get:
      tags: [Community Reports]
      summary: Read one community sharing group.
      operationId: getCommunityGroup
      parameters:
        - $ref: "#/components/parameters/CommunityGroupIdPath"
      responses:
        "200":
          description: Community sharing group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/community/groups/{groupId}/join-request:
    post:
      tags: [Community Reports]
      summary: Request membership in a community sharing group.
      operationId: requestCommunityGroupMembership
      parameters:
        - $ref: "#/components/parameters/CommunityGroupIdPath"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      responses:
        "200":
          description: Community group with the caller membership updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityGroup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/community/groups/{groupId}/members:
    post:
      tags: [Community Reports]
      summary: Add or approve a member in a managed community sharing group.
      operationId: upsertCommunityGroupMember
      parameters:
        - $ref: "#/components/parameters/CommunityGroupIdPath"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommunityGroupMemberUpsertRequest"
      responses:
        "200":
          description: Updated community group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommunityGroup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/ingest/events:
    post:
      tags: [Ingest]
      summary: Accept one canonical event envelope.
      operationId: ingestEvent
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/ContractVersionHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/canonical-event-envelope.schema.json"
      responses:
        "202":
          description: Event accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/ingest/batches:
    post:
      tags: [Ingest]
      summary: Accept a batch of canonical event envelopes.
      operationId: ingestBatch
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - $ref: "#/components/parameters/ContractVersionHeader"
        - $ref: "#/components/parameters/CorrelationIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestBatchRequest"
      responses:
        "202":
          description: Batch accepted for asynchronous processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestBatchAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/cop/tracks:
    get:
      tags: [COP]
      summary: Query policy-filtered COP tracks.
      operationId: listCopTracks
      parameters:
        - name: bbox
          in: query
          required: false
          schema:
            type: string
          description: minLon,minLat,maxLon,maxLat
        - name: layers
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: objectTypes
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: minConfidence
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 1
        - name: updatedSince
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: includeSynthetic
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include tracks older than the configured active display lifecycle.
      responses:
        "200":
          description: COP tracks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopTrackList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cop/conflicts:
    get:
      tags: [COP]
      summary: Query server-side COP conflict evidence.
      operationId: listCopConflictEvidence
      description: >
        Returns derived data-quality conflict evidence for current COP objects.
        Evidence may include affiliation variance, lifecycle variance, source
        position variance, low confidence, degraded source health and object
        states already marked as conflicted. This endpoint is informational only
        and does not provide targeting or action recommendations.
      parameters:
        - name: objectIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated object IDs. When omitted, current objects are evaluated.
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 300
          description: Evaluate recent history newer than this many seconds from server time.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 24
          description: Maximum retained points per object used for evidence.
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include tracks older than the configured active display lifecycle.
      responses:
        "200":
          description: Server-side conflict evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopConflictEvidenceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cop/alerts:
    get:
      tags: [COP]
      summary: Query policy-filtered COP alerts.
      operationId: listCopAlerts
      description: >
        Returns derived informational alerts from current COP tracks, server-side
        conflict evidence and source health. Alerts support operator
        acknowledgement, but do not provide tasking, targeting or weapon workflow.
      parameters:
        - name: includeAcknowledged
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include alerts already acknowledged by an operator.
        - name: includeExpired
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Include alerts derived from tracks outside the active lifecycle window.
      responses:
        "200":
          description: Active COP alerts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopAlertList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cop/alerts/{alertId}/acknowledge:
    post:
      tags: [COP]
      summary: Acknowledge an informational COP alert.
      operationId: acknowledgeCopAlert
      parameters:
        - name: alertId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
              additionalProperties: false
      responses:
        "200":
          description: Alert acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopAlert"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/cop/track-history:
    get:
      tags: [COP]
      summary: Query policy-filtered temporal history for COP tracks.
      operationId: listCopTrackHistory
      description: >
        Returns retained server-side temporal history points for one or more
        tracks. The result is intended for timeline/replay and route-history
        visualization; it is not an action or targeting workflow.
      parameters:
        - name: objectIds
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated object IDs. When omitted, all retained track histories are returned.
        - name: seconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Keep only points newer than this many seconds from server time.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 120
          description: Maximum retained points per object returned by this request.
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Temporal COP track history.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopTrackHistoryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/cop/subscriptions:
    post:
      tags: [COP]
      summary: Create a COP subscription for snapshot and delta distribution.
      operationId: createCopSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/cop-subscription.schema.json"
      responses:
        "201":
          description: Subscription created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopSubscriptionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/stream/cop/{subscriptionId}:
    get:
      tags: [Streaming]
      summary: Read COP snapshot for a subscription.
      operationId: streamCopSubscription
      description: >
        Returns the current subscription snapshot. The live browser stream is
        exposed at /api/v1/stream/cop/live.
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Stream established.
          content:
            text/event-stream:
              schema:
                type: string
            application/json:
              schema:
                $ref: "#/components/schemas/StreamMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/stream/cop/live:
    get:
      tags: [Streaming]
      summary: Open live COP Server-Sent Events stream.
      operationId: streamLiveCop
      description: >
        SSE stream that emits a policy-filtered snapshot, object delta messages
        from accepted ingest events, and heartbeat messages. Clients authenticate
        with the standard Authorization bearer header.
      responses:
        "200":
          description: Stream established.
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/StreamMessage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/stream/cop/health:
    get:
      tags: [Streaming]
      summary: Read COP stream health and backpressure metrics.
      operationId: getCopStreamHealth
      description: Operational health for the live COP stream. This endpoint reports distribution metrics only; it does not expose targeting or action workflow.
      responses:
        "200":
          description: Stream health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StreamHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/symbology/resolve:
    post:
      tags: [Symbology]
      summary: Resolve a canonical object into NATO symbol metadata.
      operationId: resolveSymbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/symbol-resolve-request.schema.json"
      responses:
        "200":
          description: Symbol resolution.
          content:
            application/json:
              schema:
                $ref: "./schemas/symbol-resolve-response.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/sources:
    get:
      tags: [Sources]
      summary: List registered source systems.
      operationId: listSources
      responses:
        "200":
          description: Source systems.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "./schemas/source-system.schema.json"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Sources]
      summary: Register a source system.
      operationId: createSource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/source-system.schema.json"
      responses:
        "201":
          description: Source system registered.
          content:
            application/json:
              schema:
                $ref: "./schemas/source-system.schema.json"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sources/health:
    get:
      tags: [Sources]
      summary: List source health summaries.
      operationId: listSourceHealth
      responses:
        "200":
          description: Source health summaries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceHealthList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/sources/{sourceSystemId}:
    get:
      tags: [Sources]
      summary: Get one source system.
      operationId: getSource
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdPath"
      responses:
        "200":
          description: Source system.
          content:
            application/json:
              schema:
                $ref: "./schemas/source-system.schema.json"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sources]
      summary: Update source system metadata and permissions.
      operationId: updateSource
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Source system updated.
          content:
            application/json:
              schema:
                $ref: "./schemas/source-system.schema.json"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sources/{sourceSystemId}/revoke:
    post:
      tags: [Sources]
      summary: Revoke a source system.
      operationId: revokeSource
      parameters:
        - $ref: "#/components/parameters/SourceSystemIdPath"
      responses:
        "202":
          description: Source revocation accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceLifecycleResult"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/audit/events:
    get:
      tags: [Audit]
      summary: Query audit events.
      operationId: listAuditEvents
      parameters:
        - name: correlationId
          in: query
          required: false
          schema:
            type: string
        - name: sourceSystemId
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventList"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/ai/cop-assistant/query:
    post:
      tags: [AI]
      summary: Ask the AI COP assistant for allowed data assistance.
      operationId: queryCopAssistant
      description: AI assistance is limited to explanation, summarization, query help, data quality and documentation support.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas/ai-cop-query.schema.json"
      responses:
        "200":
          description: AI assistant response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCopResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/v1/messaging/status:
    get:
      tags: [Messaging]
      summary: Read CSM Messaging provider status.
      description: >
        Server-side capability and health bridge for the standalone CSM Messaging
        service. The browser must not call the messaging provider directly or
        receive service tokens.
      operationId: getMessagingStatus
      responses:
        "200":
          description: Messaging provider status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/messaging/bootstrap:
    post:
      tags: [Messaging]
      summary: Create client-safe Matrix bootstrap for the authenticated user.
      description: >
        Authenticated COP users may request a short-lived Matrix user token for
        direct Matrix client-server communication with E2EE. This endpoint never
        returns provider, service or Synapse admin tokens and does not proxy
        plaintext messages.
      operationId: createMessagingBootstrap
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingBootstrapRequest"
      responses:
        "200":
          description: Matrix bootstrap state for the authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingBootstrap"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/messaging/conversations:
    get:
      tags: [Messaging]
      summary: List CSM Messaging conversation metadata for the authenticated user.
      description: >
        Server-side metadata bridge to CSM Messaging. It returns conversation
        metadata only; no plaintext message content is stored or proxied by COP.
      operationId: listMessagingConversations
      responses:
        "200":
          description: Conversation metadata visible to the user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConversationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Messaging]
      summary: Create CSM Messaging conversation metadata.
      description: >
        Creates only metadata, members and optional map links. Plaintext message
        fields are rejected; real messages go directly through Matrix SDK.
      operationId: createMessagingConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingConversationCreateRequest"
      responses:
        "201":
          description: Conversation metadata created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConversationCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Upstream provider did not create conversation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConversationCreateResponse"
  /api/v1/messaging/conversations/{conversationId}/members:
    post:
      tags: [Messaging]
      summary: Synchronize safe conversation members with CSM Messaging.
      description: >
        Metadata-only bridge used after COP community group membership changes.
        It forwards member identifiers/display metadata only and rejects
        plaintext message fields.
      operationId: syncMessagingConversationMembers
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingConversationMembersRequest"
      responses:
        "200":
          description: Conversation metadata with synchronized members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConversationMemberSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Upstream provider did not synchronize conversation members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingConversationMemberSyncResponse"
  /api/v1/messaging/matrix/identities/resolve:
    post:
      tags: [Messaging]
      summary: Resolve COP/CSM users to Matrix user IDs through the Messaging provider.
      description: >
        Server-side identity resolution used only for Matrix room invitations.
        The response never contains passwords, service tokens or Matrix access
        tokens for other users.
      operationId: resolveMessagingMatrixIdentities
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingMatrixIdentityResolveRequest"
      responses:
        "200":
          description: Resolved Matrix identities.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingMatrixIdentityResolution"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/messaging/conversations/{conversationId}/matrix-room:
    post:
      tags: [Messaging]
      summary: Store the Matrix room binding for a Messaging conversation.
      description: >
        Stores Matrix room metadata only. COP still does not proxy or persist
        plaintext chat messages and Matrix room membership is not used as media
        authorization.
      operationId: bindMessagingConversationMatrixRoom
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessagingMatrixRoomBindingRequest"
      responses:
        "200":
          description: Bound conversation metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingMatrixRoomBindingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          description: Upstream provider did not accept the room binding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagingMatrixRoomBindingResponse"
  /health/live:
    get:
      tags: [Health]
      summary: Liveness probe.
      operationId: healthLive
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /health/ready:
    get:
      tags: [Health]
      summary: Readiness probe.
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /health/dependencies:
    get:
      tags: [Health]
      summary: Dependency health.
      operationId: healthDependencies
      security: []
      responses:
        "200":
          description: Dependency health status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DependencyHealth"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /metrics:
    get:
      tags: [Metrics]
      summary: Prometheus metrics endpoint.
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus exposition format.
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    mtlsAuth:
      type: mutualTLS
  parameters:
    SourceSystemIdHeader:
      name: X-Source-System-Id
      in: header
      required: true
      schema:
        type: string
    IdempotencyKeyHeader:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    ContractVersionHeader:
      name: X-Contract-Version
      in: header
      required: true
      schema:
        type: string
        example: cop-ingest-v1
    CorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    SourceSystemIdPath:
      name: sourceSystemId
      in: path
      required: true
      schema:
        type: string
    CommunityReportIdPath:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommunityGroupIdPath:
      name: groupId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HistorySecondsQuery:
      name: seconds
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        default: 180
      description: Rolling history window in seconds.
    HistoryLimitQuery:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 120
      description: Maximum number of history points returned per object.
    ObjectIdsQuery:
      name: objectIds
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false
      description: Optional comma-separated object IDs.
    IncludeExpiredQuery:
      name: includeExpired
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: Include tracks older than the configured active display lifecycle.
  responses:
    BadRequest:
      description: Bad request or schema validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Policy denied the operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict, typically idempotency mismatch.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnprocessableEntity:
      description: Business validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Service unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    AuthenticatedActor:
      type: object
      required: [authMode, displayName, subjectId, username]
      properties:
        authMode:
          type: string
          enum: [lab, oidc]
        displayName:
          type: string
        email:
          type: string
          format: email
        subjectId:
          type: string
          description: Stable lab identity or OIDC subject claim.
        username:
          type: string
    UserPreferenceUpdate:
      type: object
      properties:
        alertPreferences:
          $ref: "#/components/schemas/UserAlertPreferences"
        preferences:
          $ref: "#/components/schemas/UserDisplayPreferences"
    UserPreferenceProfile:
      type: object
      required: [actor, alertPreferences, preferences, updatedAt]
      properties:
        actor:
          $ref: "#/components/schemas/AuthenticatedActor"
        alertPreferences:
          $ref: "#/components/schemas/UserAlertPreferences"
        preferences:
          $ref: "#/components/schemas/UserDisplayPreferences"
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    UserAlertPreferences:
      type: object
      properties:
        aoiRules:
          type: array
          items:
            $ref: "#/components/schemas/AoiRule"
        enabledTypes:
          type: array
          items:
            type: string
            enum: [AOI_ENTRY, LOW_CONFIDENCE, SOURCE_DEGRADED, TRACK_CONFLICT, TRACK_LOST, TRACK_STALE]
