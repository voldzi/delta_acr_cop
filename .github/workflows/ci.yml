name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate repository skeleton
        run: bash scripts/validate-skeleton.sh

      - name: Validate schemas
        run: pnpm validate:schemas

      - name: Validate OpenAPI
        run: pnpm validate:openapi

      - name: Lint and type-check
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Verify public analytics integration
        run: pnpm check:analytics

      - name: Build
        run: pnpm build

      - name: Verify bundle budgets
        run: pnpm check:bundles

      - name: Verify production static runtime
        run: pnpm check:static-runtime

      - name: Dependency audit
        run: pnpm audit --audit-level low

      - name: Docker build API
        run: docker build -f Dockerfile.api -t delta-acr-cop-api:ci .

      - name: Docker build web
        run: docker build -f Dockerfile.web -t delta-acr-cop-web:ci .

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
