services:
  cop-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: delta-acr-cop-api:local
    environment:
      COP_API_PORT: "4310"
      COP_AUTH_MODE: "${COP_AUTH_MODE:-lab}"
      COP_ALLOW_LAB_TOKEN: "${COP_ALLOW_LAB_TOKEN:-true}"
      COP_LAB_TOKEN: "${COP_LAB_TOKEN:-dev-lab-token}"
      COP_OIDC_ISSUER: "${COP_OIDC_ISSUER:-}"
      COP_OIDC_JWKS_URI: "${COP_OIDC_JWKS_URI:-}"
      COP_OIDC_ALLOWED_CLIENTS: "${COP_OIDC_ALLOWED_CLIENTS:-}"
      COP_OIDC_CLIENT_ID: "${COP_OIDC_CLIENT_ID:-cop-web}"
      COP_OIDC_REQUIRED_ROLE: "${COP_OIDC_REQUIRED_ROLE:-}"
      COP_EXTERNAL_AI_ENABLED: "false"
      COP_AI_DEFAULT_PROVIDER: "mock"
      COP_TRACK_HISTORY_STORE: "${COP_TRACK_HISTORY_STORE:-auto}"
      COP_USER_PROFILE_STORE: "${COP_USER_PROFILE_STORE:-auto}"
      COP_DATABASE_URL: "${COP_DATABASE_URL:-}"
      COP_DATABASE_SSL: "${COP_DATABASE_SSL:-false}"
      COP_DATABASE_SSL_REJECT_UNAUTHORIZED: "${COP_DATABASE_SSL_REJECT_UNAUTHORIZED:-true}"
      COP_DATABASE_POOL_MAX: "${COP_DATABASE_POOL_MAX:-5}"
      COP_DATABASE_CONNECT_TIMEOUT_MS: "${COP_DATABASE_CONNECT_TIMEOUT_MS:-5000}"
      COP_DATABASE_IDLE_TIMEOUT_MS: "${COP_DATABASE_IDLE_TIMEOUT_MS:-30000}"
      COP_STREAM_BACKPRESSURE_CLIENTS: "${COP_STREAM_BACKPRESSURE_CLIENTS:-25}"
      COP_STREAM_RETRY_MS: "${COP_STREAM_RETRY_MS:-5000}"
      COP_TRACK_STALE_AFTER_MS: "${COP_TRACK_STALE_AFTER_MS:-30000}"
      COP_TRACK_EXPIRE_AFTER_MS: "${COP_TRACK_EXPIRE_AFTER_MS:-120000}"
      COP_FLIGHT_DATA_ENABLED: "${COP_FLIGHT_DATA_ENABLED:-false}"
      COP_FLIGHT_DATA_BASE_URL: "${COP_FLIGHT_DATA_BASE_URL:-https://sim.zeleznalady.cz/flight-data}"
      COP_FLIGHT_DATA_SOURCE: "${COP_FLIGHT_DATA_SOURCE:-}"
      COP_FLIGHT_DATA_BBOX: "${COP_FLIGHT_DATA_BBOX:-}"
      COP_FLIGHT_DATA_LIMIT: "${COP_FLIGHT_DATA_LIMIT:-500}"
      COP_FLIGHT_DATA_INCLUDE_STALE: "${COP_FLIGHT_DATA_INCLUDE_STALE:-true}"
      COP_FLIGHT_DATA_POLL_MS: "${COP_FLIGHT_DATA_POLL_MS:-15000}"
      COP_FLIGHT_DATA_TIMEOUT_MS: "${COP_FLIGHT_DATA_TIMEOUT_MS:-6000}"
      COP_SITUATION_DATA_ENABLED: "${COP_SITUATION_DATA_ENABLED:-false}"
      COP_SITUATION_DATA_BASE_URL: "${COP_SITUATION_DATA_BASE_URL:-https://sim.zeleznalady.cz/situation-data/api/v1}"
      COP_SITUATION_DATA_CACHE_TTL_MS: "${COP_SITUATION_DATA_CACHE_TTL_MS:-20000}"
      COP_SITUATION_DATA_STALE_IF_ERROR_MS: "${COP_SITUATION_DATA_STALE_IF_ERROR_MS:-600000}"
      COP_SITUATION_DATA_CACHE_MAX_ENTRIES: "${COP_SITUATION_DATA_CACHE_MAX_ENTRIES:-5000}"
      COP_SITUATION_DATA_WEATHER_CACHE_TTL_MS: "${COP_SITUATION_DATA_WEATHER_CACHE_TTL_MS:-300000}"
      COP_SITUATION_DATA_WARNINGS_CACHE_TTL_MS: "${COP_SITUATION_DATA_WARNINGS_CACHE_TTL_MS:-300000}"
      COP_SITUATION_DATA_FLOOD_CACHE_TTL_MS: "${COP_SITUATION_DATA_FLOOD_CACHE_TTL_MS:-300000}"
      COP_SITUATION_DATA_AIR_QUALITY_CACHE_TTL_MS: "${COP_SITUATION_DATA_AIR_QUALITY_CACHE_TTL_MS:-300000}"
      COP_SITUATION_DATA_MOBILE_CACHE_TTL_MS: "${COP_SITUATION_DATA_MOBILE_CACHE_TTL_MS:-900000}"
      COP_SITUATION_DATA_GROUND_CACHE_TTL_MS: "${COP_SITUATION_DATA_GROUND_CACHE_TTL_MS:-21600000}"
      COP_SITUATION_DATA_TRAFFIC_CACHE_TTL_MS: "${COP_SITUATION_DATA_TRAFFIC_CACHE_TTL_MS:-20000}"
      COP_SITUATION_DATA_MAX_LIMIT: "${COP_SITUATION_DATA_MAX_LIMIT:-250}"
      COP_SITUATION_DATA_TIMEOUT_MS: "${COP_SITUATION_DATA_TIMEOUT_MS:-15000}"
      COP_SAFETY_DATA_ENABLED: "${COP_SAFETY_DATA_ENABLED:-false}"
      COP_SAFETY_DATA_BASE_URL: "${COP_SAFETY_DATA_BASE_URL:-https://sim.zeleznalady.cz/safety-data/api/v1}"
      COP_SAFETY_DATA_CACHE_TTL_MS: "${COP_SAFETY_DATA_CACHE_TTL_MS:-120000}"
      COP_SAFETY_DATA_STALE_IF_ERROR_MS: "${COP_SAFETY_DATA_STALE_IF_ERROR_MS:-1200000}"
      COP_SAFETY_DATA_CACHE_MAX_ENTRIES: "${COP_SAFETY_DATA_CACHE_MAX_ENTRIES:-5000}"
      COP_SAFETY_DATA_WARNINGS_CACHE_TTL_MS: "${COP_SAFETY_DATA_WARNINGS_CACHE_TTL_MS:-120000}"
      COP_SAFETY_DATA_FLOOD_CACHE_TTL_MS: "${COP_SAFETY_DATA_FLOOD_CACHE_TTL_MS:-300000}"
      COP_SAFETY_DATA_MAX_LIMIT: "${COP_SAFETY_DATA_MAX_LIMIT:-250}"
      COP_SAFETY_DATA_TIMEOUT_MS: "${COP_SAFETY_DATA_TIMEOUT_MS:-15000}"
    ports:
      - "${COP_API_PORT:-4310}:4310"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4310/health/live"]
      interval: 20s
      timeout: 5s
      retries: 5

  cop-web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_COP_API_BASE_URL: "${COP_PUBLIC_API_BASE_URL-http://localhost:${COP_API_PORT:-4310}}"
        VITE_COP_PUBLIC_LAB_VALUE: "${COP_PUBLIC_LAB_VALUE:-dev-lab-token}"
        VITE_COP_AUTH_MODE: "${COP_WEB_AUTH_MODE:-lab}"
        VITE_COP_OIDC_ISSUER: "${COP_OIDC_ISSUER:-}"
        VITE_COP_OIDC_CLIENT_ID: "${COP_OIDC_CLIENT_ID:-cop-web}"
        VITE_COP_OIDC_SCOPE: "${COP_OIDC_SCOPE:-openid profile email}"
        VITE_COP_REFRESH_MS: "${COP_WEB_REFRESH_MS:-5000}"
        VITE_COP_TILE_URL: "${COP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}"
        VITE_COP_TILE_ATTRIBUTION: "${COP_TILE_ATTRIBUTION:-&copy; OpenStreetMap contributors}"
        VITE_COP_MAP_CENTER: "${COP_MAP_CENTER:-14.42,50.08}"
        VITE_COP_MAP_ZOOM: "${COP_MAP_ZOOM:-8}"
    image: delta-acr-cop-web:local
    environment:
      COP_WEB_PORT: "4311"
      COP_DEPLOY_DOMAIN: "${COP_DEPLOY_DOMAIN:-docker.home.cz}"
      COP_WEB_ALLOWED_HOSTS: "${COP_WEB_ALLOWED_HOSTS:-}"
    ports:
      - "${COP_WEB_PORT:-4311}:4311"
    depends_on:
      cop-api:
        condition: service_healthy
